(function(){
  function placeText(containerId, texts, radiusPct){
    var el=document.getElementById(containerId);
    if(!el)return;
    var n=texts.length;
    for(var i=0;i<n;i++){
      var angle=(i/n)*2*Math.PI - Math.PI/2; // start from top (-90deg)
      var x=50 + radiusPct*Math.cos(angle);
      var y=50 + radiusPct*Math.sin(angle);
      var s=document.createElement('span');
      s.textContent=texts[i];
      s.style.left=x+'%';s.style.top=y+'%';
      el.appendChild(s);
    }
  }
  var ss24=['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙','午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
  var bg8=['☰乾','☴巽','☲离','☷坤','☳震','☵坎','☶艮','☱兑'];
  placeText('compass-text-24', ss24, 47); // outer ring radius %
  placeText('compass-text-8', bg8, 36);   // middle ring radius %
})();

function getPalaceCenter(idx){
  var el=document.querySelector('.iztro-palace:nth-child('+(idx+1)+')');
  if(!el)return null;
  var r=el.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}

function drawSFLines(targetIdx){
  var sf=[(targetIdx+4)%12,(targetIdx+8)%12,(targetIdx+6)%12];
  var tc=getPalaceCenter(targetIdx);
  if(!tc){SF_LINES.style.display='none';return}
  var ids=['sf-line1','sf-line2','sf-line3'];
  for(var i=0;i<3;i++){
    var sc=getPalaceCenter(sf[i]);
    var el=document.getElementById(ids[i]);
    if(sc&&el){
      el.setAttribute('x1',tc.x);el.setAttribute('y1',tc.y);
      el.setAttribute('x2',sc.x);el.setAttribute('y2',sc.y);
      el.style.display='';
    }else if(el){el.style.display='none';}
  }
  SF_LINES.style.display='';
}

function highlightSF(targetIdx,on){
  var sf=[targetIdx,(targetIdx+4)%12,(targetIdx+8)%12,(targetIdx+6)%12];
  var palaces=document.querySelectorAll('.iztro-palace');
  palaces.forEach(function(p,i){
    if(sf.indexOf(i)>=0){
      p.style.boxShadow=on?'0 0 8px rgba(212,168,67,.4),inset 0 0 12px rgba(212,168,67,.08)':'';
      p.style.borderColor=on?'rgba(212,168,67,.5)':'';
      p.style.zIndex=on?'10':'';
    }
  });
}

function showSFPanel(targetIdx){
  var sf=[targetIdx,(targetIdx+4)%12,(targetIdx+8)%12,(targetIdx+6)%12];

  var allStars={};
  sf.forEach(function(idx){
    var p=document.querySelectorAll('.iztro-palace')[idx];
    if(!p)return;
    var name=(p.querySelector('.iztro-palace-name')||{}).textContent||palNames[idx];
    var stars=[];p.querySelectorAll('.iztro-star').forEach(function(s){stars.push(s.textContent.trim())});
    allStars[name]=stars;
  });

  var html='<div style="font-size:13px;font-weight:700;color:#d4a843;margin-bottom:6px">三方四正综合解读</div>';
  var names=Object.keys(allStars);
  for(var i=0;i<names.length;i++){

  }
  SF_PANEL.innerHTML=html;SF_PANEL.style.display='';
}

function hideSF(){
  SF_ACTIVE=-1;SF_LINES.style.display='none';SF_PANEL.style.display='none';
  document.querySelectorAll('.iztro-palace').forEach(function(p){p.style.boxShadow='';p.style.borderColor='';p.style.zIndex='';});

// 事件委托：监听 #root 上的 mouseover
document.getElementById('root').addEventListener('mouseover',function(e){
  var pal=e.target.closest('.iztro-palace');
  if(!pal){hideSF();return}
  var palaces=document.querySelectorAll('.iztro-palace');
  var idx=-1;for(var i=0;i<palaces.length;i++){if(palaces[i]===pal){idx=i;break;}}
  if(idx<0||idx===SF_ACTIVE)return;
  SF_ACTIVE=idx;
  highlightSF(idx,true);drawSFLines(idx);showSFPanel(idx);
},true);

document.getElementById('root').addEventListener('mouseleave',function(e){
  if(e.target.closest&&!e.target.closest('.iztro-palace'))hideSF();

var palaceObs=new MutationObserver(function(){
  var fp=document.querySelector('.iztro-palace.focused-palace');
  if(!fp){pdEl.classList.remove('show');return}
  pdEl.classList.add('show');

  var nameEl=fp.querySelector('.iztro-palace-name');
  var gzEl=fp.querySelector('.iztro-palace-gz');
  var majorStars=fp.querySelectorAll('.iztro-star-major,.iztro-star-soft,.iztro-star-tough');
  var minorStars=fp.querySelectorAll('.iztro-star-minor .iztro-star,.iztro-star-adj .iztro-star');
  var palName=nameEl?nameEl.textContent.trim():'';
  var ganzhi=gzEl?gzEl.textContent.trim():'';

  // 匹配宫位key
  var palKey='';
  var palKeys=Object.keys(PALACE_MEANING);
  for(var k=0;k<palKeys.length;k++){
    if(palName.indexOf(PALACE_MEANING[palKeys[k]].charAt(0)+PALACE_MEANING[palKeys[k]].charAt(1))>=0||
       palName===(['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','交友','官禄','田宅','福德','父母'][k])){
      palKey=palKeys[k];break;
    }
  }

  var html='<div class="pd-name">'+palName+'</div>';
  html+='<div class="pd-ganzhi">'+ganzhi+'</div>';

  // 主星
  var majorHtml=[];
  majorStars.forEach(function(s){
    var sn=s.textContent.trim();
    var sk=Object.keys(STAR_MEANING).find(function(x){return sn.indexOf(x)>=0});
    majorHtml.push('<span class="pd-star" title="'+(STAR_MEANING[sk]||'')+'">'+sn+'</span>');
  });
  if(majorHtml.length){html+='<div class="pd-section"><div class="pd-label">主星</div>'+majorHtml.join('')+'</div>'}

  // 辅星
  var minorHtml=[];
  minorStars.forEach(function(s){
    var sn=s.textContent.trim();
    minorHtml.push('<span class="pd-star minor">'+sn+'</span>');
  });
  if(minorHtml.length){html+='<div class="pd-section"><div class="pd-label">辅星</div>'+minorHtml.join('')+'</div>'}

  // 宫位解读
  if(palKey&&PALACE_MEANING[palKey]){html+='<div class="pd-desc">'+PALACE_MEANING[palKey]+'</div>'}

  pdEl.innerHTML=html;
});
setTimeout(function(){palaceObs.observe(document.getElementById('root')||document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});},2000);

var obs=new MutationObserver(function(){var r=document.getElementById('root');if(r&&r.textContent.length>100&&!AIT){AIT=r.innerText.slice(0,4000);panel.classList.add('on');}});
setTimeout(function(){obs.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});},2000);

function addMsg(text){var d=document.createElement('div');d.className='msg ai';d.innerHTML=text;body.appendChild(d);body.scrollTop=body.scrollHeight}

async function doAsk(question){
  if(!AIK){AIK=prompt('DeepSeek API Key:',AIK||'sk-');if(AIK)localStorage.setItem('ds_key',AIK);else return}
  panel.classList.add('on');var ud=document.createElement('div');ud.className='msg user';ud.textContent=question;body.appendChild(ud);
  var md=document.createElement('div');md.className='msg ai';md.innerHTML='<span class="loading"></span> ...';body.appendChild(md);body.scrollTop=body.scrollHeight;
  var prompt=AIT?('紫微斗数命盘:\n'+AIT.slice(0,3000)+'\n\n问题: '+question):question;
  try{
    var resp=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,apiKey:AIK})});
    if(!resp.ok)throw new Error((await resp.json().catch(function(){return{}})).error||'HTTP '+resp.status);
    var reader=resp.body.getReader(),dec=new TextDecoder(),buf='',html='';md.innerHTML='';
    while(true){var r=await reader.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){if(!lines[i].startsWith('data: '))continue;var d=lines[i].slice(6);if(d==='[DONE]')continue;try{var j=JSON.parse(d);if(j.delta&&j.delta.text){html+=j.delta.text.replace(/\n/g,'<br>');md.innerHTML=html}}catch(e){}}body.scrollTop=body.scrollHeight;}
  }catch(e){md.innerHTML='ERROR: '+(e.message||'request failed')}
  body.scrollTop=body.scrollHeight;
}
})();
