<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>诊断 — 模块加载测试</title>
<style>
body { font-family: monospace; padding: 20px; background: #1a1510; color: #e0d5c5; }
.pass { color: #5d8a7c; } .fail { color: #c41e0a; } .info { color: #c9a96e; }
pre { background: #221d16; padding: 8px; border-radius: 4px; overflow-x: auto; }
</style>
</head>
<body>
<h1>模块加载诊断</h1>
<div id="log"></div>
<script type="module">
var log = document.getElementById('log');
function ok(msg) { log.innerHTML += '<div class="pass">✅ ' + msg + '</div>'; }
function err(msg) { log.innerHTML += '<div class="fail">❌ ' + msg + '</div>'; }
function info(msg) { log.innerHTML += '<div class="info">📋 ' + msg + '</div>'; }

window.onerror = function(msg, src, line, col, error) {
  err('全局错误: ' + msg + ' @ ' + src + ':' + line);
};

try {
  info('开始加载模块...');

  // 测试1: state.js
  try {
    var m1 = await import('./js/state.js');
    ok('state.js 加载成功, exports: ' + Object.keys(m1));
    if (m1.State && typeof m1.State.on === 'function') {
      ok('  State.on() 可用');
    } else {
      err('  State.on 不可用');
    }
  } catch(e) { err('state.js: ' + e.message); }

  // 测试2: dom-helpers.js
  try {
    var m2 = await import('./js/dom-helpers.js');
    ok('dom-helpers.js 加载成功, exports: ' + Object.keys(m2));
    if (typeof m2.$ === 'function') ok('  $() 可用');
    if (typeof m2._highlightFab === 'function') ok('  _highlightFab() 可用');
  } catch(e) { err('dom-helpers.js: ' + e.message); }

  // 测试3: api.js
  try {
    var m3 = await import('./js/api.js');
    ok('api.js 加载成功, exports: ' + Object.keys(m3));
    if (m3.API && typeof m3.API.post === 'function') ok('  API.post() 可用');
  } catch(e) { err('api.js: ' + e.message); }

  // 测试4: router.js
  try {
    var m4 = await import('./js/router.js');
    ok('router.js 加载成功, exports: ' + Object.keys(m4));
  } catch(e) { err('router.js: ' + e.message); }

  // 测试5: calendar-ui.js
  try {
    var m5 = await import('./js/calendar-ui.js');
    ok('calendar-ui.js 加载成功, exports: ' + Object.keys(m5));
  } catch(e) { err('calendar-ui.js: ' + e.message); }

  info('诊断完成');
} catch(e) {
  err('顶层错误: ' + e.message + '\n' + (e.stack || ''));
}
</script>
</body>
</html>
