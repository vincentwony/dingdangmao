<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中央信息面板 · 生辰四柱大运（模块化）</title>
<style>
  /* 整体白底黑字，仅指定文字上色 */
  body { margin: 0; background: #f0ece4; padding: 1.5rem; font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif; }
  .zw-infopanel {
    background: #fff; color: #1a1a1a;
    border: 1px solid #D4B896; border-radius: 10px;
    padding: 0.7rem 1rem; box-sizing: border-box; line-height: 1.55; max-width: 760px; margin: 0 auto;
  }
  .zw-infopanel .c-green  { color: #1B7A1B; }
  .zw-infopanel .c-orange { color: #D97706; }
  .zw-infopanel .c-red    { color: #C41E0A; }
  .zw-infopanel .c-purple { color: #8E24AA; }
  .zw-infopanel .c-blue   { color: #1565C0; }

  .zw-infopanel .ip-head { text-align: center; font-size: 0.82rem; margin-bottom: 0.45rem; }
  .zw-infopanel .ip-head > div { margin: 1px 0; }

  .zw-infopanel .ip-pillars { display: flex; justify-content: center; gap: 2.75rem; margin-bottom: 0.45rem; }
  .zw-infopanel .ip-col { text-align: center; }
  .zw-infopanel .ip-col-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 0.2rem; }
  .zw-infopanel .ip-gan, .zw-infopanel .ip-zhi {
    display: flex; justify-content: center; gap: 0.55rem; font-size: 1.1rem; font-weight: 700;
  }
  .zw-infopanel .ip-zhi { margin-top: 2px; }

  .zw-infopanel .ip-qiyun { text-align: center; font-size: 0.8rem; margin: 0.35rem 0; }
  .zw-infopanel .ip-dayun { margin: 0.35rem 0; }
  .zw-infopanel .ip-dy-row {
    display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; font-size: 0.82rem; padding: 1px 0;
  }
  .zw-infopanel .ip-dy-row span { white-space: nowrap; }
  .zw-infopanel .ip-dy-shen { font-weight: 700; }
  .zw-infopanel .ip-zihua { text-align: center; font-size: 0.9rem; font-weight: 700; margin-top: 0.45rem; }
</style>
</head>
<body>
  <!-- 渲染挂载点 -->
  <div id="zw-info-host"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   中央信息面板（生辰 · 四柱 · 大运 · 自化）
   数据驱动：替换下方 ZW_INFO 文本即可更换他人生辰排盘，
   布局 / 配色自动套用（与项目 web/js/ziwei-ui.js 的 ZW_INFO 保持一致）。
   配色 token：green / orange / red / purple / blue / 空(黑)
   ════════════════════════════════════════════════════════════════ */
var ZW_INFO = {
  head: { clock: '1982-05-10 12:20', lunar: '壬戌年 四月十七日午时', soul: '巨门', body: '文昌', ziDou: '卯' },
  // 四柱：左「节气四柱」与右「非节气四柱」文字完全一致；t=字, c=配色 token
  pillars: {
    gan: [ {t:'壬',c:'green'}, {t:'乙',c:'green'}, {t:'癸',c:''}, {t:'戊',c:'orange'} ],
    zhi: [ {t:'戌',c:'orange'}, {t:'巳',c:'red'}, {t:'巳',c:'red'}, {t:'午',c:'red'} ]
  },
  qiYun: '出生后8年11月11天八字起运',
  daYun: {
    shen:    [ {g:'丙',s:'正财',c:'red'}, {g:'丁',s:'偏财',c:'purple'}, {g:'戊',s:'正财'}, {g:'己',s:'七杀'}, {g:'庚',s:'正印'}, {g:'辛',s:'偏印'}, {g:'壬',s:'劫财'}, {g:'癸',s:'比肩'} ],
    zhiShen: [ {z:'午',s:'财'}, {z:'未',s:'财'}, {z:'申',s:'官'}, {z:'酉',s:'杀'}, {z:'戌',s:'印'}, {z:'亥',s:'印'}, {z:'子',s:'财'}, {z:'丑',s:'局'} ],
    ages:    ['10岁','20岁','30岁','40岁','50岁','60岁','70岁','80虚岁'],
    years:   ['1991','2001','2011','2021','2031','2041','2051','2061']
  },
  ziHua: [ {q:'禄',c:'green'}, {q:'权',c:'purple'}, {q:'科',c:'blue'}, {q:'忌',c:''} ]
};

function _ipCol(t, c) { return c ? '<b class="c-' + c + '">' + t + '</b>' : t; }

function renderZiweiInfo(d) {
  var gan = d.pillars.gan.map(function(x){ return '<span>' + _ipCol(x.t, x.c) + '</span>'; }).join('');
  var zhi = d.pillars.zhi.map(function(x){ return '<span>' + _ipCol(x.t, x.c) + '</span>'; }).join('');
  var colBlock = ''
    + '<div class="ip-col">'
    +   '<div class="ip-col-title">节气四柱</div>'
    +   '<div class="ip-gan">' + gan + '</div>'
    +   '<div class="ip-zhi">' + zhi + '</div>'
    + '</div>'
    + '<div class="ip-col">'
    +   '<div class="ip-col-title">非节气四柱</div>'
    +   '<div class="ip-gan">' + gan + '</div>'
    +   '<div class="ip-zhi">' + zhi + '</div>'
    + '</div>';

  var shen = d.daYun.shen.map(function(x){
    return '<span><b class="' + (x.c ? 'c-' + x.c : '') + '">' + x.g + '</b>' + (x.s || '') + '</span>';
  }).join('');
  var zhishen = d.daYun.zhiShen.map(function(x){ return '<span>' + x.z + (x.s || '') + '</span>'; }).join('');
  var ages = d.daYun.ages.map(function(x){ return '<span>' + x + '</span>'; }).join('');
  var years = d.daYun.years.map(function(x){ return '<span>' + x + '</span>'; }).join('');

  var ziHua = d.ziHua.map(function(x){ return '<span>一' + _ipCol(x.q, x.c) + '</span>'; }).join(' ');

  return '<div class="zw-infopanel">'
    + '<div class="ip-head">'
    +   '<div>钟表时间: ' + d.head.clock + '</div>'
    +   '<div>农历: ' + d.head.lunar + '</div>'
    +   '<div>命主: ' + d.head.soul + ' 身主: ' + d.head.body + ' 子斗:' + d.head.ziDou + '</div>'
    + '</div>'
    + '<div class="ip-pillars">' + colBlock + '</div>'
    + '<div class="ip-qiyun">' + d.qiYun + '</div>'
    + '<div class="ip-dayun">'
    +   '<div class="ip-dy-row ip-dy-shen">' + shen + '</div>'
    +   '<div class="ip-dy-row ip-dy-zhishen">' + zhishen + '</div>'
    +   '<div class="ip-dy-row ip-dy-age">' + ages + '</div>'
    +   '<div class="ip-dy-row ip-dy-year">' + years + '</div>'
    + '</div>'
    + '<div class="ip-zihua">自化图示: ' + ziHua + '</div>'
    + '</div>';
}

// 挂载渲染
document.getElementById('zw-info-host').innerHTML = renderZiweiInfo(ZW_INFO);
</script>
</body>
</html>
