<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗数命盘</title>
<style>
  :root {
    --p-w: 162px;
    --p-h: 130px;
    --c-border: #fff;
    --c-bg: #000;
    --c-text: #eee;
    --c-red: #e74c3c;
    --c-blue: #3498db;
    --c-purple: #9b59b6;
    --c-gray: #7f8c8d;
  }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #1a1a1a; color: #ddd; font-family: "Noto Serif SC", "SimSun", serif; padding: 24px; }

  .header { text-align: center; margin-bottom: 18px; }
  .header .title { font-size: 18px; color: #f0f0f0; letter-spacing: 2px; }
  .header .sub { font-size: 12px; color: #9aa0a6; margin-top: 6px; letter-spacing: 1px; }

  /* 12 宫方格（地支定位，中心 2×2 留空） */
  .chart {
    display: grid;
    grid-template-columns: repeat(4, var(--p-w));
    grid-template-rows: repeat(4, var(--p-h));
    gap: 6px;
  }

  /* 单宫容器 */
  .palace {
    position: relative;
    width: var(--p-w);
    height: var(--p-h);
    border: 1px solid var(--c-border);
    background: var(--c-bg);
    color: var(--c-text);
    box-sizing: border-box;
    overflow: hidden;
  }
  .palace.body-palace { border-color: #d4a017; }

  /* 顶部星耀三行（每星一列：名1 / 名2 / 庙旺，自下而上） */
  .stars {
    position: absolute;
    top: 4px;
    left: 4px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
  }
  .row { display: flex; gap: 1px; }
  .cell { width: 15px; text-align: center; font-size: 11px; line-height: 1; }

  /* 中间：小限 / 大限 */
  .center {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 150px;
    line-height: 1.3;
  }
  .center .ages { font-size: 7px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .center .range { font-weight: bold; font-size: 10px; margin-top: 1px; }

  /* 左侧横排三行（左下角：博士/将前/岁前 十二神） */
  .side-left {
    position: absolute;
    left: 2px;
    bottom: 5px;
    display: flex;
    flex-direction: column;
    font-size: 10px;
    line-height: 1.4;
    text-align: left;
  }

  /* 右侧竖排两词（右下角：十二长生 + 宫干支，干支加粗） */
  .side-right {
    position: absolute;
    right: 4px;
    bottom: 4px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }
  .side-right .vword {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 1px;
  }
  .side-right .bold { font-weight: bold; }

  /* 底部宫名（红色） */
  .palace-name {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--c-red);
    font-size: 12px;
    white-space: nowrap;
  }

  /* 配色 */
  .c-red    { color: var(--c-red); }
  .c-blue   { color: var(--c-blue); }
  .c-purple { color: var(--c-purple); }
  .c-gray   { color: var(--c-gray); }
</style>
</head>
<body>

<div class="header">
  <div class="title">紫微斗数命盘</div>
  <div class="sub" id="subline"></div>
</div>

<div class="chart" id="chart"></div>

<script>
const DATA = __DATA__;

// 地支 → 方格坐标（标准命盘布局）
const ZHI_POS = {
  '巳':[1,1], '午':[1,2], '未':[1,3], '申':[1,4],
  '辰':[2,1],                       '酉':[2,4],
  '卯':[3,1],                       '戌':[3,4],
  '寅':[4,1], '丑':[4,2], '子':[4,3], '亥':[4,4]
};

function starColor(type) {
  if (type === 'major') return 'c-red';
  if (type === 'soft') return 'c-purple';
  if (type === 'tough') return 'c-blue';
  if (type === 'flower') return 'c-red';
  return '';
}

function buildStars(p) {
  const stars = []
    .concat(p.majorStars || [])
    .concat(p.minorStars || [])
    .concat(p.adjectiveStars || [])
    .map(function (s) {
      return { name: s.name, brightness: s.brightness || '', color: starColor(s.type) };
    });
  const r1 = [], r2 = [], r3 = [];
  stars.forEach(function (s) {
    r1.push('<span class="cell ' + s.color + '">' + (s.name[0] || '') + '</span>');
    r2.push('<span class="cell ' + s.color + '">' + (s.name.length > 1 ? s.name[1] : '') + '</span>');
    r3.push('<span class="cell c-gray">' + s.brightness + '</span>');
  });
  return '<div class="stars">' +
    '<div class="row">' + r1.join('') + '</div>' +
    '<div class="row">' + r2.join('') + '</div>' +
    '<div class="row">' + r3.join('') + '</div>' +
  '</div>';
}

function buildCenter(p) {
  const ages = (p.ages || []).join(',');
  const range = (p.decadal && p.decadal.range) ? p.decadal.range.join(' ~ ') : '';
  return '<div class="center">' +
    '<div class="ages">小限：' + ages + '</div>' +
    '<div class="range">' + range + '</div>' +
  '</div>';
}

function buildLeft(p) {
  const left = [p.boshi12, p.jiangqian12, p.suiqian12].filter(Boolean);
  return '<div class="side side-left">' + left.map(function (t) { return '<div>' + t + '</div>'; }).join('') + '</div>';
}

function buildRight(p) {
  const zhi = (p.heavenlyStem || '') + (p.earthlyBranch || '');
  const words = [p.changsheng12, zhi].filter(Boolean);
  return '<div class="side side-right">' + words.map(function (t) {
    return '<div class="vword ' + (t === zhi ? 'bold' : '') + '">' + t + '</div>';
  }).join('') + '</div>';
}

function renderPalace(p) {
  const pos = ZHI_POS[p.earthlyBranch] || [1, 1];
  const cls = p.isBodyPalace ? 'palace body-palace' : 'palace';
  return '<div class="' + cls + '" style="grid-row:' + pos[0] + ';grid-column:' + pos[1] + ';">' +
    buildStars(p) + buildCenter(p) + buildLeft(p) + buildRight(p) +
    '<div class="palace-name">' + p.name + '</div>' +
  '</div>';
}

document.getElementById('subline').textContent =
  '阳男 · ' + (DATA.meta.fourPillars.year + ' ' + DATA.meta.fourPillars.month + ' ' +
  DATA.meta.fourPillars.day + ' ' + DATA.meta.fourPillars.hour) +
  ' · ' + DATA.meta.fiveElementsClass + ' · 命宫(' + DATA.meta.soul + ') 身宫(' + DATA.meta.body + ')';

document.getElementById('chart').innerHTML = DATA.palaces.map(renderPalace).join('');
</script>
</body>
</html>
