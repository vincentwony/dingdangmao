<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<style>
  body { background:#1c1813; margin:0; padding:0; }
  /* 预览里把固定页眉改为相对定位，便于堆叠对比；真实应用不受影响 */
  .top-nav { position: relative !important; box-shadow:none; }
  .demo { margin:0 0 26px; }
  .demo-cap {
    font: 600 13px/1 "PingFang SC","Microsoft YaHei",sans-serif;
    color:#8a7a5c; letter-spacing:2px; padding:14px 16px 6px;
    border-top:1px solid rgba(201,169,110,.12);
  }
  .demo-cap:first-child { border-top:none; }
  .brand-mark .mk { width:30px; height:30px; display:block; }
  .brand-mark { display:flex; align-items:center; }
  /* 模拟内容条：证明页眉整合后不遮挡内容 */
  .mock {
    height:64px; margin:0 16px 4px; border-radius:10px;
    background:
      radial-gradient(120px 60px at 20% 30%, rgba(201,169,110,.10), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
    border:1px solid rgba(201,169,110,.10);
    display:flex; align-items:center; padding:0 18px;
    color:#5f5645; font:500 12px/1 "PingFang SC",sans-serif; letter-spacing:1px;
  }
  .mock b { color:#8a7a5c; font-weight:600; margin-right:14px; }
</style>
</head>
<body>

<!-- ══ 方案 H1 · 罗盘星轨 ══ -->
<div class="demo">
  <div class="demo-cap">方案 H1 · 罗盘星轨（同心刻度盘 + 四芒星，呼应「推演/万年历」）</div>
  <header class="top-nav" role="banner" aria-label="天地玄黄日历">
    <div class="top-nav-inner">
      <div class="top-nav-row1">
        <a class="top-nav-brand" id="brandHome" href="#home" aria-label="天地玄黄 · 返回首页">
          <span class="brand-mark">
            <svg class="mk" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="17" fill="none" stroke="#D4A853" stroke-width="1.2"/>
              <circle cx="20" cy="20" r="15.4" fill="none" stroke="#D4A853" stroke-width="3" stroke-dasharray="1 4.1" opacity=".75"/>
              <circle cx="20" cy="20" r="11" fill="none" stroke="#D4A853" stroke-width=".5" opacity=".4"/>
              <path d="M20 8 L21.6 18.4 L32 20 L21.6 21.6 L20 32 L18.4 21.6 L8 20 L18.4 18.4 Z" fill="#D4A853"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">天地玄黄</span><span class="brand-sep">·</span><span class="brand-sub">日月更替</span>
          </span>
          <span class="badge">八卦掌决版</span>
        </a>
        <nav class="top-nav-tabs" aria-label="主导航">
          <button class="tab-item" id="tabHome"><span class="tab-label">首页</span></button>
          <button class="tab-item tab-active" id="tabCalendar"><span class="tab-label">年历</span></button>
          <button class="tab-item" id="tabNianli"><span class="tab-label">节气</span></button>
          <button class="tab-item" id="tabBazi"><span class="tab-label">八字</span></button>
          <button class="tab-item" id="tabZiwei"><span class="tab-label">紫微</span></button>
          <button class="tab-item" id="tabNote"><span class="tab-label">记事</span></button>
          <button class="tab-item" id="tabSettings"><span class="tab-label">设置</span></button>
        </nav>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="打开导航菜单"><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span></button>
      </div>
    </div>
  </header>
  <div class="mock"><b>八月 2026</b> 初一 · 丙午月 · 乙巳日　|　今日宜：祭祀 祈福　忌：动土</div>
</div>
