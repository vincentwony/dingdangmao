<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<title>环境自检 · 公信万年历</title>
<style>
:root{
  --bg:#100b06; --bg2:#1a1208; --card:rgba(255,255,255,.045);
  --line:rgba(212,175,55,.18); --gold:#d4af37; --gold-dim:#8c7228;
  --txt:#f0e6d2; --muted:#9d9384;
  --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:20px 16px calc(40px + env(safe-area-inset-bottom));
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,.10), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--txt);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
}
h1{
  margin:0 0 4px;font-size:21px;font-weight:600;letter-spacing:.5px;
  background:linear-gradient(135deg,#f5e5b8,var(--gold) 55%,var(--gold-dim));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:20px;word-break:break-all}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:14px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  animation:rise .45s cubic-bezier(.16,1,.3,1) both;
}
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.1s}
.card:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{
  margin:0 0 10px;font-size:13px;font-weight:600;color:var(--gold);
  letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.row{
  display:flex;align-items:flex-start;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px;
}
.row:last-child{border-bottom:0}
.k{flex:0 0 auto;min-width:104px;color:var(--muted)}
.v{flex:1;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.tag{
  display:inline-block;padding:1px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.3px;
}
.t-ok{background:rgba(74,222,128,.14);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.t-bad{background:rgba(248,113,113,.14);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
.t-warn{background:rgba(251,191,36,.14);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
.verdict{
  border-radius:16px;padding:16px;margin-bottom:16px;font-size:14px;
  border:1px solid;animation:rise .45s cubic-bezier(.16,1,.3,1) both;
}
.v-ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.32)}
.v-bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.32)}
.verdict b{display:block;font-size:16px;margin-bottom:6px}
.v-ok b{color:var(--ok)} .v-bad b{color:var(--bad)}
.verdict p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.btn{
  display:block;width:100%;margin-top:8px;padding:13px;
  background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(212,175,55,.07));
  border:1px solid rgba(212,175,55,.35);border-radius:13px;
  color:var(--gold);font-size:14.5px;font-weight:600;letter-spacing:.5px;
  cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;
  font-family:inherit;
}
.btn:active{transform:scale(.975);box-shadow:0 0 22px rgba(212,175,55,.2)}
.spin{
  display:inline-block;width:11px;height:11px;border:2px solid rgba(212,175,55,.25);
  border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-1px;
}
@keyframes sp{to{transform:rotate(360deg)}}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:#e8d9a8;
}
</style>
</head>
<body>

<h1>环境自检</h1>
<div class="sub" id="url"></div>

<div id="verdict"></div>

<div class="card">
  <h2>运行环境</h2>
  <div id="env"></div>
</div>

<div class="card">
  <h2>签名自检</h2>
  <div id="sign"></div>
</div>

<div class="card">
  <h2>接口连通</h2>
  <div id="apis"></div>
  <button class="btn" id="retry">重新检测</button>
</div>

<script type="module">
import { API } from '/js/api.js';
import { hmacSha256Hex } from '/js/sha256.js';
import { HMAC_KEY, buildMessage } from '/js/hmac-spec.js';

const $ = id => document.getElementById(id);
$('url').textContent = location.href;

const tag = (ok, txt) =>
  `<span class="tag ${ok === true ? 't-ok' : ok === false ? 't-bad' : 't-warn'}">${txt}</span>`;
const row = (k, v) => `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`;

// ── 1. 运行环境 ──────────────────────────────────
const secure = window.isSecureContext;
const hasCrypto = typeof crypto !== 'undefined';
const hasSubtle = hasCrypto && !!crypto.subtle && typeof crypto.subtle.importKey === 'function';
const hasRandom = hasCrypto && typeof crypto.getRandomValues === 'function';
const hasSW = 'serviceWorker' in navigator;

$('env').innerHTML =
  row('协议', `<code>${location.protocol}</code>`) +
  row('主机', `<code>${location.host}</code>`) +
  row('安全上下文', secure ? tag(true, '是') : tag(null, '否 · HTTP 局域网')) +
  row('crypto.subtle', hasSubtle ? tag(true, '可用') : tag(null, '不可用 · 已回退')) +
  row('getRandomValues', hasRandom ? tag(true, '可用') : tag(null, '降级')) +
  row('Service Worker', hasSW && secure ? tag(true, '可用') : tag(null, '不可用 · 仅影响离线')) +
  row('TextEncoder', typeof TextEncoder !== 'undefined' ? tag(true, '可用') : tag(null, '降级'));

// ── 2. 签名自检（固定向量，服务端 hmac.sign 生成）─────────
const VEC = { mid: 'diagtest', ts: 1700000000000, nonce: 'abcd1234',
              path: '/api/v1/calendar/month', expect: 'ac70ee24' };

let signHtml = row('签名后端',
  API.signBackend() === 'WebCrypto' ? tag(true, 'Web Crypto') : tag(null, '纯 JS 回退'));

const pureSig = hmacSha256Hex(HMAC_KEY, buildMessage(VEC.mid, VEC.ts, VEC.nonce, VEC.path)).slice(0, 8);
const pureOK = pureSig === VEC.expect;
signHtml += row('纯 JS 实现', pureOK ? tag(true, '正确 ' + pureSig) : tag(false, '错误 ' + pureSig));

let liveOK = false;
try {
  const liveSig = await API._sign(VEC.mid, VEC.ts, VEC.nonce, VEC.path);
  liveOK = liveSig === VEC.expect;
  signHtml += row('实际签名链路', liveOK ? tag(true, '正确 ' + liveSig) : tag(false, '错误 ' + liveSig));
} catch (e) {
  signHtml += row('实际签名链路', tag(false, '异常：' + e.message));
}
signHtml += row('机器码', `<code>${API._getMachineId()}</code>`);
$('sign').innerHTML = signHtml;

// ── 3. 接口连通 ──────────────────────────────────
const TESTS = [
  ['万年历·月', '/calendar/month', { y: 2026, m: 8 }],
  ['万年历·日', '/calendar/day', { y: 2026, m: 8, d: 2 }],
  ['八字排盘', '/bazi', { y: 1982, m: 5, d: 10, h: 12, min: 20, sex: '男' }],
  ['紫微排盘', '/ziwei/astrolabe', { y: 1982, m: 5, d: 10, h: 12, min: 20, sex: '男' }]
];

async function runApis() {
  const el = $('apis');
  el.innerHTML = TESTS.map(t =>
    row(t[0], '<span class="spin"></span>')).join('');

  const results = [];
  let html = '';
  for (const [label, path, body] of TESTS) {
    const t0 = performance.now();
    try {
      const r = await API.post(path, body);
      const ms = Math.round(performance.now() - t0);
      const ok = !!(r && r.ok);
      results.push(ok);
      html += row(label, ok ? tag(true, `200 · ${ms}ms`) : tag(false, '返回异常'));
    } catch (e) {
      results.push(false);
      html += row(label, tag(false, String(e.message).slice(0, 40)));
    }
    el.innerHTML = html + TESTS.slice(results.length)
      .map(t => row(t[0], '<span class="spin"></span>')).join('');
  }

  const allOK = results.every(Boolean) && liveOK;
  $('verdict').className = 'verdict ' + (allOK ? 'v-ok' : 'v-bad');
  $('verdict').innerHTML = allOK
    ? `<b>✓ 一切正常</b><p>签名链路与全部 ${results.length} 个接口均连通，可正常使用。${
        secure ? '' : '当前为 HTTP 局域网，已自动启用纯 JS 签名回退。'}</p>`
    : `<b>✗ 存在故障</b><p>${
        !liveOK ? '签名链路异常 —— 请检查 <code>sha256.js</code> 是否正确加载。'
        : '部分接口不通 —— 请确认服务端运行中，且手机与电脑处于同一 WiFi。'}</p>`;
}

$('retry').addEventListener('click', runApis);
runApis();
</script>
</body>
</html>
