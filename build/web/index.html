<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="x5-fullscreen" content="true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="var(--text-heading)">
<title>天地玄黄 · 日月更替 — 八卦掌决版</title>

<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<style>
/* ══════ CSS Reset ══════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══════ 字体 + 图标 ══════ */
@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css');

:root {
  --color-gold: var(--color-gold);
  --color-gold-bright: var(--color-gold-bright);
  --color-gold-pale: var(--color-gold-pale);
  --color-cinnabar: var(--color-cinnabar);
  --text-primary: var(--text-primary);
  --text-muted: var(--text-muted);
  --font-display: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', 'KaiTi', '楷体', serif;
  --font-body: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

/* ══════ 基础 ══════ */
html { height: 100%; }
body {
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  overflow-x: hidden;
  position: relative;
}

/* ══════ 水墨山水背景 ══════ */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -2;
  background: url('/img/bg-landscape.webp') center / cover no-repeat;
}

/* 暖黄宣纸遮罩层 */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 30%, rgba(253,248,240,0.55) 0%, rgba(245,237,224,0.72) 50%, rgba(235,224,208,0.85) 100%);
}

/* ══════ 主容器 ══════ */
.landing {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  padding: 2rem 1.5rem 3rem;
  text-align: center;
  animation: fadeUp 1s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════ 标题区 ══════ */
.brand { margin-bottom: 0.75rem; }
.brand-icon {
  display: inline-block;
  width: 100px; height: 100px;
  background: url('/img/home.webp') center / contain no-repeat;
  margin-bottom: 0.75rem;
  position: relative;
  animation: iconFloat 3.6s ease-in-out infinite;
  filter: drop-shadow(0 0 18px rgba(184,134,11,0.35));
  transition: filter 0.8s ease;
}
/* 光晕 — 径向渐变呼吸 */
.brand-icon::after {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,83,0.25) 0%, rgba(184,134,11,0.08) 40%, transparent 70%);
  animation: glowPulse 2.8s ease-in-out infinite;
  pointer-events: none;
}

@keyframes iconFloat {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.10); }
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: scale(0.85); }
  50%      { opacity: 1; transform: scale(1.18); }
}
.brand-title-img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto 0.3rem;
  animation: titInkSpread 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

/* ══════ 标题动效 6 选 1（改 class 即可切换） ══════ */

/* ① 水墨晕染（默认）— 模糊→清晰 + 放大浮现 */
@keyframes titInkSpread {
  0%   { opacity: 0; filter: blur(20px); transform: scale(0.85); }
  60%  { opacity: 1; filter: blur(3px); transform: scale(1.02); }
  100% { opacity: 1; filter: blur(0); transform: scale(1); }
}

/* ② 金箔展开 — 水平从中间向两端展开 */
.tit-gold-unfold {
  animation: titGoldUnfold 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}
@keyframes titGoldUnfold {
  0%   { opacity: 0; clip-path: inset(0 50% 0 50%); transform: scale(0.9); }
  100% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); }
}

/* ③ 篆刻落印 — 上方坠落 + 弹性着地 */
.tit-seal-stamp {
  animation: titSealStamp 0.8s cubic-bezier(0.68, -0.2, 0.27, 1.2) both;
}
@keyframes titSealStamp {
  0%   { opacity: 0; transform: translateY(-60px) scale(0.7); }
  70%  { opacity: 1; transform: translateY(4px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ④ 烟云聚散 — 淡入上浮 */
.tit-mist-rise {
  animation: titMistRise 1.5s ease-out both;
}
@keyframes titMistRise {
  0%   { opacity: 0; transform: translateY(30px); filter: blur(8px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* ⑤ 书卷徐展 — 从左向右渐显 */
.tit-scroll-unfurl {
  animation: titScrollUnfurl 1s ease-out both;
}
@keyframes titScrollUnfurl {
  0%   { opacity: 0; clip-path: inset(0 100% 0 0); }
  100% { opacity: 1; clip-path: inset(0 0 0 0); }
}

/* ⑥ 流光入墨 — 右侧滑入 + 金光闪烁 */
.tit-light-flow {
  animation: titLightFlow 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes titLightFlow {
  0%   { opacity: 0; transform: translateX(50px); filter: brightness(2) saturate(0.3); }
  60%  { opacity: 1; transform: translateX(-3px); filter: brightness(1.3) saturate(0.7); }
  100% { opacity: 1; transform: translateX(0); filter: brightness(1) saturate(1); }
}
.brand .tagline {
  font-size: 0.85rem;
  color: var(--color-white);
  letter-spacing: 0.12em;
  margin-top: 0.3rem;
}
.brand .badge {
  display: inline-block;
  font-size: 0.7rem;
  color: var(--color-cinnabar);
  border: 1px solid rgba(196,30,10,0.3);
  border-radius: 20px;
  padding: 2px 12px;
  margin-top: 0.5rem;
  letter-spacing: 0.06em;
}

/* ══════ 分割线 ══════ */
.divider {
  display: flex; align-items: center; gap: 1rem;
  margin: 1.5rem 0;
  color: var(--color-gold-pale);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--color-gold-pale), transparent);
}

/* ══════ 功能入口卡片 ══════ */
.entries {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.entry-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.25rem 1.5rem;
  background: rgba(255,255,255,0.88);
  border: 1.5px solid rgba(184,134,11,0.25);
  border-radius: 16px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  text-align: left;
}
.entry-card:hover {
  border-color: var(--color-gold);
  background: rgba(255,255,255,0.95);
  box-shadow: 0 8px 32px rgba(184,134,11,0.15);
  transform: translateY(-2px);
}
.entry-card:active { transform: scale(0.98); }

.entry-icon {
  flex-shrink: 0;
  width: 56px; height: 56px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  color: #fff;
}
.entry-icon.calendar {
  background: linear-gradient(135deg, #8B6914, #B8860B);
  box-shadow: 0 4px 16px rgba(184,134,11,0.25);
}
.entry-icon.bazi {
  background: linear-gradient(135deg, #5D3A1A, #8B5E3C);
  box-shadow: 0 4px 16px rgba(139,94,60,0.25);
}
.entry-icon.ziwei {
  background: linear-gradient(135deg, #3B1F6E, #6B3FA0);
  box-shadow: 0 4px 16px rgba(107,63,160,0.25);
}

.entry-info { flex: 1; min-width: 0; }
.entry-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-heading);
  letter-spacing: 0.04em;
}
.entry-desc {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
  line-height: 1.5;
}
.entry-arrow {
  flex-shrink: 0;
  color: var(--color-gold-pale);
  font-size: 1.2rem;
  transition: transform 0.3s;
}
.entry-card:hover .entry-arrow { transform: translateX(4px); color: var(--color-gold); }

/* ══════ 页脚 ══════ */
.footer {
  margin-top: 2rem;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  line-height: 1.8;
}
.footer .sep { margin: 0 0.5rem; opacity: 0.5; }

/* ══════ 响应式 ══════ */
@media (max-width: 480px) {
  .landing { padding: 1.5rem 1rem 2rem; }
  .brand-icon { width: 72px; height: 72px; }
  .entry-card { padding: 1rem 1.2rem; }
  .entry-icon { width: 44px; height: 44px; font-size: 1.2rem; border-radius: 12px; }
}

/* ══════ prefers-reduced-motion ══════ */
@media (prefers-reduced-motion: reduce) {
  .landing { animation: none; }
  .brand-icon, .brand-icon::after { animation: none !important; }
  .entry-card { transition: none; }
  .entry-card:hover { transform: none; }
}
</style>
</head>
<body>

<main class="landing" role="main" aria-label="公信万年历首页">

  <div class="brand">
    <div class="brand-icon" aria-hidden="true"></div>
    <img src="/img/270%C3%9728mm_1.svg" alt="天地玄黄 · 日月更替" class="brand-title-img">
    <p class="tagline">遵天时 · 循神煞 · 趋吉避凶</p>
    <span class="badge">八卦掌决版</span>
  </div>

  <div class="divider">公 信 万 年 历</div>

  <nav class="entries" aria-label="功能导航">
    <a href="/app.html" class="entry-card" aria-label="进入万年历">
      <div class="entry-icon calendar">
        <i class="ti ti-calendar" aria-hidden="true"></i>
      </div>
      <div class="entry-info">
        <div class="entry-title">萬年历</div>
        <div class="entry-desc">黄历查询 · 每日宜忌 · 建除十二神 · 时辰吉凶</div>
      </div>
      <i class="ti ti-chevron-right entry-arrow" aria-hidden="true"></i>
    </a>

    <a href="/app.html#bazi" class="entry-card" aria-label="进入八字排盘">
      <div class="entry-icon bazi">
        <i class="ti ti-yin-yang" aria-hidden="true"></i>
      </div>
      <div class="entry-info">
        <div class="entry-title">八字排盘</div>
        <div class="entry-desc">四柱推命 · 大运流年 · 十神格局 · 喜用从格</div>
      </div>
      <i class="ti ti-chevron-right entry-arrow" aria-hidden="true"></i>
    </a>

    <a href="/app.html#ziwei" class="entry-card" aria-label="进入紫微斗数">
      <div class="entry-icon ziwei">
        <i class="ti ti-stars" aria-hidden="true"></i>
      </div>
      <div class="entry-info">
        <div class="entry-title">紫微斗数</div>
        <div class="entry-desc">星盘十二宫 · 四化飞星 · 大限流年</div>
      </div>
      <i class="ti ti-chevron-right entry-arrow" aria-hidden="true"></i>
    </a>
  </nav>

  <footer class="footer">
    <p>公信万年历 · 八卦掌决版 &nbsp; 岁次推演范围：公元前 4712 年 — 公元 9999 年</p>
    <p>历算核心承自寿星万年历<span class="sep">|</span>神煞体系基于 lunisolar</p>
    <p>指导老师：王贵柱<span class="sep">|</span>校对：覃芹芹<span class="sep">|</span>设计：vincent</p>
  </footer>

</main>

<script>
(function() {
  var classes = [
    '',                  // ① 水墨晕染
    'tit-gold-unfold',   // ② 金箔展开
    'tit-seal-stamp',    // ③ 篆刻落印
    'tit-mist-rise',     // ④ 烟云聚散
    'tit-scroll-unfurl', // ⑤ 书卷徐展
    'tit-light-flow'     // ⑥ 流光入墨
  ];
  var names = ['水墨晕染','金箔展开','篆刻落印','烟云聚散','书卷徐展','流光入墨'];
  var key = '_tit_anim_idx';

  // 轮流使用，不重复
  var last = parseInt(localStorage.getItem(key), 10);
  if (isNaN(last)) last = -1;
  var idx = (last + 1) % classes.length;
  localStorage.setItem(key, idx);

  var img = document.querySelector('.brand-title-img');
  if (img && classes[idx]) {
    img.classList.add(classes[idx]);
    img.style.animationName = ''; // 由 class 接管
  }
  console.log('[首页] 标题动效 #' + (idx + 1) + '：' + names[idx]);
})();
</script>

</body>
</html>
