<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授权流程测试 — RSA 签名/验签</title>
<style>

  --font-body: "PingFang SC", "Microsoft YaHei", sans-serif;

}
body { font-family: var(--font-body); background: var(--c-bg); color: var(--c-text); padding: 20px; max-width: 700px; margin: 0 auto; }

.pass { color: var(--c-success); font-weight: 700; }
.fail { color: var(--c-cinnabar); font-weight: 700; }
.result { background: #F8F4E8; border-radius: 8px; padding: 14px; margin: 10px 0; font-size: 13px; word-break: break-all; }

<body>
<h1>&#9889; 授权流程测试</h1>
<p style="color:#6B5C52;font-size:12px">验证 RSA 签名/验签流程是否正确，确认客户端和作者端可以正常交互。</p>

<button class="btn btn-run" onclick="runAllTests()">运行全部测试</button>
<button class="btn btn-clear" onclick="document.getElementById('log').textContent=''">清空日志</button>

<h2>测试日志</h2>
<div id="log">点击"运行全部测试"开始...</div>
</body>

<script>
var logEl = document.getElementById('log');
function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

// 硬编码的公钥（与 index.html 中一致）
var PUBLIC_KEY_PEM =
  '-----BEGIN PUBLIC KEY-----\n' +
  'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAhpKEljtTL+hARN0u2ck9\n' +
  'PhV9P4p0zyxUDR2EBACED6wPIUjvrVmU600CBmK3A905qdW8F6oz8A4KWwb49DX+\n' +
  '95aiOm7iJF2GkSssZLeRBdIs3uOcyvWtOaFHpmDixH3VEb53cxDVnLKLQRMwJO81\n' +
  'RAjMV3ye5UTwoTDWYg5gkg9h3qsg49/3S6oAdPsInDCRkbFTH43JrD6v1lzqhACe\n' +
  'Nhg4qNZiu0XGnIUREucmbcPHjXh1BJl/h3wsGw8M06mMGCIUDIAkaDKHiTXxWsr/\n' +
  '+zOrfp3GzkSt/vnhS+gmCmGQOHl0gTzBYz4Q4p1CPI7joOENAIQl/J8Z7xk7FKeD\n' +
  'ZQIDAQAB\n' +
  '-----END PUBLIC KEY-----';

var cryptoKeyPair = null;

// ── Base64url ──
function sigBase64Encode(buf) {
  var b64 = btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}
function base64urlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  var binary = atob(str);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
function bufToBase64(buf) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ── 导入密钥 ──
async function importPublicKey(pem) {
  var b64 = pem.replace('-----BEGIN PUBLIC KEY-----', '').replace('-----END PUBLIC KEY-----', '').replace(/\s/g, '');
  return crypto.subtle.importKey('spki', base64ToBuf(b64), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['verify']);
}

async function importPrivateKey(pem) {
  var b64 = pem.replace('-----BEGIN PRIVATE KEY-----', '').replace('-----END PRIVATE KEY-----', '').replace(/\s/g, '');
  return crypto.subtle.importKey('pkcs8', base64ToBuf(b64), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
}

// ═══════════════════════════════════════════
// 测试 1：签名/验签基本流程
// ═══════════════════════════════════════════
async function test1_sign_verify() {
  log('── 测试1: 签名/验签基本流程 ──');

  // 使用一个模拟的机器码
  var machineId = 'A1B2C3D4E5F6G7H8';
  var timestamp = Date.now();
  var payload = machineId + '|lifetime|' + timestamp;
  log('  载荷: ' + payload);

  // 签名
  var sig = await crypto.subtle.sign(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.privateKey,
    new TextEncoder().encode(payload)
  );
  log('  签名长度: ' + sig.byteLength + ' bytes (预期256)');
  log('  签名验证: ' + (sig.byteLength === 256 ? 'PASS' : 'FAIL - 长度不对'));

  // 验签
  var valid = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sig,
    new TextEncoder().encode(payload)
  );
  log('  验签结果: ' + (valid ? 'PASS' : 'FAIL'));

  return { valid: valid, sig: sig, payload: payload, machineId: machineId, timestamp: timestamp };
}

// ═══════════════════════════════════════════
// 测试 2：注册码生成/解析往返
// ═══════════════════════════════════════════
async function test2_roundtrip(result1) {
  log('\n── 测试2: 注册码生成/解析往返 ──');

  var sigB64 = sigBase64Encode(result1.sig);
  var licenseData = result1.payload + '|' + sigB64;
  log('  完整注册数据: ' + licenseData.slice(0, 80) + '...');
  log('  注册数据长度: ' + licenseData.length + ' 字符');

  // 5 字符分组（模拟给客户的格式）
  var groups = [];
  for (var i = 0; i < licenseData.length; i += 5) groups.push(licenseData.slice(i, i + 5));
  var formattedCode = groups.join('-');
  log('  分组格式: ' + formattedCode.slice(0, 80) + '...');

  // 解析回去
  var ungrouped = formattedCode.replace(/-/g, '');
  log('  去分隔符后长度: ' + ungrouped.length + ' (应与原始一致: ' + (licenseData.length === ungrouped.length ? 'PASS' : 'FAIL') + ')');

  // 提取 payload 和 signature
  // 格式: machineId|lifetime|timestamp|signature(base64url)
  var parts = ungrouped.split('|');
  var sigPart = parts.pop();  // 最后一段是签名
  var payloadPart = parts.join('|');
  log('  提取载荷: ' + payloadPart);
  log('  提取签名(部分): ' + sigPart.slice(0, 40) + '...');

  // 验签
  var sigBytes = base64urlDecode(sigPart);
  var valid = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sigBytes,
    new TextEncoder().encode(payloadPart)
  );
  log('  往返验签: ' + (valid ? 'PASS' : 'FAIL'));

  return valid;
}

// ═══════════════════════════════════════════
// 测试 3：篡改检测
// ═══════════════════════════════════════════
async function test3_tamper(result1) {
  log('\n── 测试3: 篡改检测 ──');

  var sigB64 = sigBase64Encode(result1.sig);
  var licenseData = result1.payload + '|' + sigB64;

  // 篡改机器码
  var tamperedPayload = 'FAKE1234ABCD5678|lifetime|' + result1.timestamp;
  var tamperedData = tamperedPayload + '|' + sigB64;
  var sigBytes = base64urlDecode(sigB64);

  var valid = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sigBytes,
    new TextEncoder().encode(tamperedPayload)
  );
  log('  篡改机器码后验签: ' + (valid ? 'FAIL - 应该失败！' : 'PASS - 正确拒绝'));

  // 篡改时间戳
  var tamperedPayload2 = result1.machineId + '|lifetime|9999999999999';
  var valid2 = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sigBytes,
    new TextEncoder().encode(tamperedPayload2)
  );
  log('  篡改时间戳后验签: ' + (valid2 ? 'FAIL - 应该失败！' : 'PASS - 正确拒绝'));

  // 篡改授权类型
  var tamperedPayload3 = result1.machineId + '|yearly|' + result1.timestamp;
  var valid3 = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sigBytes,
    new TextEncoder().encode(tamperedPayload3)
  );
  log('  篡改授权类型后验签: ' + (valid3 ? 'FAIL - 应该失败！' : 'PASS - 正确拒绝'));

  return !valid && !valid2 && !valid3;
}

// ═══════════════════════════════════════════
// 测试 4：公钥单独验签
// ═══════════════════════════════════════════
async function test4_public_only(result1) {
  log('\n── 测试4: 仅用公钥验签（模拟客户端）──');

  // 客户端只有公钥
  var pubKey = await importPublicKey(PUBLIC_KEY_PEM);

  var sigB64 = sigBase64Encode(result1.sig);
  var licenseData = result1.payload + '|' + sigB64;

  var parts = licenseData.split('|');
  var sigPart = parts.pop();
  var payloadPart = parts.join('|');

  var sigBytes = base64urlDecode(sigPart);
  var valid = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    pubKey,
    sigBytes,
    new TextEncoder().encode(payloadPart)
  );
  log('  公钥验签: ' + (valid ? 'PASS' : 'FAIL'));

  return valid;
}

// ═══════════════════════════════════════════
// 测试 5：不同机器码不可互换
// ═══════════════════════════════════════════
async function test5_different_machines() {
  log('\n── 测试5: 不同机器码不可互换 ──');

  var mid1 = 'A1B2C3D4E5F6G7H8';
  var mid2 = 'Z9Y8X7W6V5U4T3S2';
  var ts = Date.now();

  var payload1 = mid1 + '|lifetime|' + ts;
  var sig1 = await crypto.subtle.sign(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.privateKey,
    new TextEncoder().encode(payload1)
  );

  // 用 mid2 验证 mid1 的签名
  var payload2 = mid2 + '|lifetime|' + ts;
  var valid = await crypto.subtle.verify(
    { name: 'RSASSA-PKCS1-v1_5' },
    cryptoKeyPair.publicKey,
    sig1,
    new TextEncoder().encode(payload2)
  );
  log('  机器码A的注册码用于机器码B: ' + (valid ? 'FAIL - 应该拒绝！' : 'PASS - 正确拒绝'));

  return !valid;
}

// ═══════════════════════════════════════════

      'AuPCaRZpmqzB64aBRbPL5Q3auoRtjeOvbFoOaiR6BoyLNv4JiFHb7sZaMVDmHghU\n' +
      'Cdq3ygNRKU8oKQbE/E5DFYYhGDEQtL40uahOST7b4muFQ24GwofSc1SxAoGAHgb4\n' +

      'rkq0XLQBoqr0zO65oh91d2s/ylC1JfKOpkvOwoYRF0FNjGiG5yb7LfQCQZMpr77L\n' +
      'xNO/x4pB2cqZ27m0Og4TndmSnxSqADStGGPQGgUCgYBClRh39G+M3pEEAxpYZQNo\n' +
      'uRe6xSh+75CyH9eKp9oAMMuSZWkpt4QylUEAomqL00dYLS+9xsWL/P5WaQ07P6mq\n' +
      'fkvHtAbX1HnyiJR6TfUe6+PF/WPvyS/qI/phBu4OcBNjmn4IwfNegAE65OL1XrwR\n' +
      'uUO/ix9vbINT0QHLQoYuYQ==\n' +

    var pubKey = await importPublicKey(PUBLIC_KEY_PEM);

  } catch(e) {

  }

  // 运行测试
  try {
    var r1 = await test1_sign_verify();

    var r2 = await test2_roundtrip(r1);

    var r3 = await test3_tamper(r1);

  log('\n═══════════════════════════════════════');
  log('  结果: ' + passed + ' 通过, ' + failed + ' 失败');

</script>
